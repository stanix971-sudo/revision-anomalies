const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open_(key){const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
 const html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()}
async function tryStored(){try{const raw=localStorage.getItem("revKey");if(!raw)return;
 const key=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},true,["decrypt"]);await open_(key)}catch(e){try{localStorage.removeItem("revKey")}catch(_){}}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("go"),err=document.getElementById("err");
 b.disabled=true;b.textContent="Vérification…";err.textContent="";
 try{const key=await keyFrom(document.getElementById("pw").value);
  if(document.getElementById("rm").checked){const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));try{localStorage.setItem("revKey",btoa(String.fromCharCode(...raw)))}catch(_){}}
  await open_(key)}
 catch(x){err.textContent="Mot de passe incorrect. Réessaie.";b.disabled=false;b.textContent="Accéder"}};
window.addEventListener("load",()=>setTimeout(tryStored,0));
</script></body></html>
